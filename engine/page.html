<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitsu Studio Preview</title>
<style>
  @font-face { font-family: 'Fredoka'; font-weight: 600; src: url(fonts/fredoka-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Fredoka'; font-weight: 700; src: url(fonts/fredoka-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Lora'; font-style: italic; font-weight: 500; src: url(fonts/lora-latin-500-italic.woff2) format('woff2'); }
  html, body { margin: 0; background: #17121f; color: #f4e9dc; font: 16px/1.4 'Fredoka', system-ui, sans-serif; }
  #wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 10px; font-weight: 600; }
  canvas { display: block; width: 100%; height: auto; border-radius: 10px; background: #000; }
  #controls { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button { font: 600 16px 'Fredoka', sans-serif; padding: 8px 16px; border-radius: 8px; border: 0; background: #f39a4a; color: #2a1408; cursor: pointer; }
  input[type=range] { flex: 1; min-width: 160px; }
  #status { opacity: .75; font-size: 14px; }
  body.export #wrap { padding: 0; max-width: none; }
  body.export h1, body.export #controls, body.export #status { display: none; }
  body.export canvas { width: 1920px; height: 1080px; border-radius: 0; }
  body.embed { background: #000; }
  body.embed #wrap { padding: 0; max-width: none; }
  body.embed h1, body.embed #controls, body.embed #status { display: none; }
  body.embed canvas { border-radius: 0; }
</style>
</head>
<body>
<div id="wrap">
  <h1 id="title">Kitsu Studio</h1>
  <canvas id="film" width="1920" height="1080"></canvas>
  <div id="controls">
    <button id="play">▶ Play with sound</button>
    <button id="stop">■ Stop</button>
    <input id="scrub" type="range" min="0" max="10" step="0.01" value="0">
    <span id="time">0.00 s</span>
  </div>
  <p id="status"></p>
</div>
<script src="characters.js"></script>
<script src="assets.js"></script>
<script src="places/index.js"></script>
<script src="pictures.js"></script>
<script src="story.js"></script>
<script src="film.js"></script>
<script src="audio.js"></script>
<script>
  const qs = new URLSearchParams(location.search);
  if (qs.has('export')) document.body.classList.add('export');
  if (qs.has('embed')) document.body.classList.add('embed');
  const $ = id => document.getElementById(id);
  const ready = (async () => {
    const plan = await (await fetch(qs.get('plan'))).json();
    // load the drawing file of every character in the story (listed in characters.js) and every asset file
    // (props, extras and places, as found when the story was compiled)
    const load = src => new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
    for (const id of plan.cast) if (StudioCharacters.CHARACTERS[id]) await load(StudioCharacters.CHARACTERS[id].script);
    for (const f of plan.assetFiles) await load(f);
    $('title').textContent = plan.meta.title;
    $('scrub').max = plan.duration;
    await StudioFilm.init($('film'), plan);
    return plan;
  })();
  window.FILM = {
    ready: ready.then(() => true),
    render: t => StudioFilm.render(t),
    renderAudio: async stem => StudioAudio.renderAudio(await ready, stem),
  };

  // Live preview: the picture follows the audio clock so both stay in sync.
  let actx = null, t0 = 0, raf = 0;
  const show = t => { StudioFilm.render(t); $('scrub').value = t; $('time').textContent = t.toFixed(2) + ' s'; };
  async function play() {
    stop();
    const plan = await ready;
    actx = new AudioContext();
    const { buffers, missing } = await StudioAudio.loadVoices(actx, plan);
    $('status').textContent = missing.length ? `Some voice clips are missing: ${missing.join(', ')}` : '';
    t0 = actx.currentTime + 0.15;
    StudioAudio.buildAudio(actx, t0, plan, buffers);
    const tick = () => { const t = actx.currentTime - t0; show(Math.max(0, t)); if (t < plan.duration) raf = requestAnimationFrame(tick); else stop(); };
    raf = requestAnimationFrame(tick);
  }
  function stop() { cancelAnimationFrame(raf); if (actx) { actx.close(); actx = null; } }
  $('play').onclick = play;
  $('stop').onclick = stop;
  $('scrub').oninput = e => { stop(); show(+e.target.value); };

  // Embedded in the studio app (?embed=1): the app drives the player through window.PREVIEW.
  // The sound is the whole soundtrack mixed once, offline, the same way as for the video, so it can play from any moment.
  let mix = null, src = null, from = 0, startAt = 0, onTime = () => {};
  async function mixed() {
    if (mix) return mix;
    const plan = await ready, sr = 48000, oc = new OfflineAudioContext(2, Math.max(1, Math.round(sr * plan.duration)), sr);
    const { buffers, missing } = await StudioAudio.loadVoices(oc, plan);
    StudioAudio.buildAudio(oc, 0, plan, buffers);
    mix = { buffer: await oc.startRendering(), missing };
    return mix;
  }
  const embedStop = () => { cancelAnimationFrame(raf); if (src) { src.stop(); src = null; } if (actx) { actx.close(); actx = null; } };
  window.PREVIEW = {
    ready: ready.then(p => ({ duration: p.duration })),
    // play from t seconds; the picture follows the sound clock
    async play(t) {
      embedStop();
      const plan = await ready, m = await mixed();
      from = Math.max(0, Math.min(t, plan.duration)); actx = new AudioContext();
      src = actx.createBufferSource(); src.buffer = m.buffer; src.connect(actx.destination);
      startAt = actx.currentTime + 0.05; src.start(startAt, from);
      const tick = () => {
        if (!actx) return;
        const now = from + Math.max(0, actx.currentTime - startAt);
        StudioFilm.render(Math.min(now, plan.duration)); onTime(now, true);
        if (now < plan.duration) raf = requestAnimationFrame(tick); else { embedStop(); onTime(plan.duration, false); }
      };
      raf = requestAnimationFrame(tick);
      return m.missing;
    },
    pause() { embedStop(); },
    async seek(t) { embedStop(); const plan = await ready; StudioFilm.render(Math.max(0, Math.min(t, plan.duration))); onTime(t, false); },
    onTime(cb) { onTime = cb; },
    // the current frame as a PNG (data URL), full size
    still: () => $('film').toDataURL('image/png'),
  };
</script>
</body>
</html>
